name: Docker

# Every push publishes the image tagged with the computed version. On main that is the plain
# version (e.g. 0.12.321) plus "latest"; on any other branch it carries the branch name
# (e.g. 0.12.321-feat-save-sync) and never "latest", so a branch can be tried without
# touching what main users pull. Pull requests only build, to catch breakage.
# Every push also publishes a release v<version> (nothing to attach: the image is the release) and so tags the commit; its
# body is written by scripts/release_notes.py from the commits since the previous release. On a branch other than main it is
# marked as a pre-release. The same notes are baked into the image as backend/changelog.md, for the Changelog tab of the web UI.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mog-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version script needs the full history

      - id: gv
        run: python3 scripts/version.py

      - name: Release notes for the image
        run: python3 scripts/release_notes.py --repo "${{ github.repository }}" --version "${{ steps.gv.outputs.version }}" --changelog backend/changelog.md

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.gv.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MOG_VERSION=${{ steps.gv.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version and the notes need the full history and its tags

      - id: gv
        run: python3 scripts/version.py

      - name: Release notes
        run: |
          python3 scripts/release_notes.py --repo "${{ github.repository }}" --version "${{ steps.gv.outputs.version }}" \
            --header .github/release-header.md --body RELEASE.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gv.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MOG Server v${{ steps.gv.outputs.version }}
          draft: false
          prerelease: ${{ github.ref_name != 'main' }}
          body_path: RELEASE.md
